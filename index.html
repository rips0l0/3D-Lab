:root[data-theme="dark"]{--bg:#1b1b19;--s1:#2a2a27;--tx:#ecebe6;--t2:#a9a79f;--bd:#444441;--bs:#7a786f}

.top{position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:4}
.top>*{pointer-events:auto}
button{font:inherit;color:var(--tx);cursor:pointer}
.pill{border:0.5px solid var(--bs);background:var(--bg);border-radius:2em;padding:.3em .8em;font-size:.9em;font-weight:500}
.stk{display:flex;flex-direction:column;align-items:center;gap:4px}
#v3{border:0.5px solid var(--bs);background:var(--bg);border-radius:1em;font-size:.8em;padding:.1em .9em}
#sh{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;background:var(--bg);border-radius:16px 16px 0 0;box-shadow:0 -2px 14px rgba(0,0,0,.18)}
body.side #sh{left:auto;top:0;border-radius:16px 0 0 16px;box-shadow:-2px 0 14px rgba(0,0,0,.18)}
#hz{flex:none;touch-action:none;-webkit-user-select:none;user-select:none}

.tabs{display:flex;border-bottom:0.5px solid var(--bd)}

.panes{flex:1;overflow:auto;padding:.4em 1em .7em}

.pane{display:none}.pane.on{display:block}
.hr{display:flex;gap:.6em;align-items:center;height:2.2em}
.sw{width:1.5em;height:1.5em;border-radius:.35em;border:0.5px solid var(--bs);flex:none}
.m{font-size:.8em;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.r2 output{text-align:right;font-variant-numeric:tabular-nums}
.r2 input{width:100%;margin:0}
.r2 input.num{box-sizing:border-box;text-align:right;font:inherit;font-variant-numeric:tabular-nums;color:var(--tx);background:var(--bg);border:0.5px solid var(--bs);border-radius:.4em;padding:.15em .35em;-webkit-user-select:text;user-select:text;-moz-appearance:textfield;appearance:textfield}
.r2 input.num::-webkit-inner-spin-button,.r2 input.num::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.r2 input.num:focus{outline:1.5px solid var(--ac);outline-offset:0}
.r2 button.sg{width:100%;height:1.9em;padding:0;font:inherit;line-height:1;color:var(--tx);background:var(--bg);border:0.5px solid var(--bs);border-radius:.4em}
.r2 button.sg:active{background:var(--s1)}
.gt{font-size:.8em;color:var(--t2);margin:.6em 0 .3em}
.gr{align-items:center;margin-top:.6em}.gr .gt{margin:0 .2em 0 0}
.chips{display:flex;flex-wrap:wrap;gap:.4em}
.chip input{display:none}
.chip span{display:inline-block;border:0.5px solid var(--bs);border-radius:1.5em;padding:.2em .65em;font-size:.82em;color:var(--t2)}

.res{background:var(--s1);border-radius:.6em;padding:.5em .7em;margin-top:.6em;font-size:.88em;color:var(--t2)}
.res b{color:var(--tx);font-weight:500}.big{font-size:1.5em}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:.85em}
.lg i{display:inline-block;width:14px;height:3px;margin-right:5px;vertical-align:middle}
.rb{margin-top:.7em;border:0.5px solid var(--bs);background:none;border-radius:.6em;padding:.4em .9em;font-size:.88em}
.au{font-size:.8em;color:var(--t2);text-align:center;margin-top:.9em}
